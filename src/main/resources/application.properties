spring.application.name=estoques

# Configuração do servidor
server.port=8080

# Configurações do banco de dados MySQL
# Defina a variável DB_URL no formato JDBC do MySQL, por exemplo:
# jdbc:mysql://localhost:3306/estoques?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA
spring.jpa.show-sql=true
# Use dialect adequado para MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

